<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keeper logo options, round 2</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;600&family=Instrument+Serif:ital@0;1&display=swap">
<style>
  :root{--brand:#6E4BD8;--ink:#1E1B26;--ink-2:#5F596D;--line:#ECE9F1}
  *{box-sizing:border-box}
  body{margin:0;background:#F5F3F9;font-family:"Instrument Sans",system-ui,sans-serif;color:var(--ink);padding:32px 16px}
  h1{margin:0 0 4px;font-size:28px;letter-spacing:-.02em}
  p.sub{margin:0 0 24px;color:var(--ink-2);font-size:16px;max-width:760px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;max-width:1400px}
  .opt{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:14px}
  .opt h2{margin:0;font-size:18px;display:flex;align-items:center}
  .opt p{margin:0;color:var(--ink-2);font-size:15px;line-height:1.4}
  .row{display:flex;align-items:center;gap:18px}
  .tile{width:96px;height:96px;flex:none}
  .small{display:flex;gap:10px;align-items:center}
  .small svg{width:32px;height:32px}
  .small .tiny{width:18px;height:18px}
  .lockup{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:12px;background:#FAF9FC}
  .lockup svg{width:30px;height:30px}
  .lockup span{font-family:"Instrument Serif",Georgia,serif;font-style:italic;font-size:30px;line-height:1}
  .num{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:8px;background:var(--brand);color:#fff;font-size:14px;font-weight:600;margin-right:8px}
</style>
</head>
<body>
<h1>Keeper logo options, round 2</h1>
<p class="sub">Ten directions on one idea: many things coming in, all caught and kept in one place. Each is shown as an app icon, at small sizes, and next to the wordmark.</p>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <!-- 6 Funnel -->
    <symbol id="m1" viewBox="0 0 120 120">
      <rect width="120" height="120" rx="30" fill="#6E4BD8"/>
      <circle cx="38" cy="26" r="7" fill="#fff"/><circle cx="60" cy="20" r="7" fill="#fff"/><circle cx="82" cy="26" r="7" fill="#fff"/>
      <path d="M26 44h68L68 74v20a8 8 0 0 1-16 0V74z" fill="#fff"/>
    </symbol>
    <!-- 7 Bowl of three -->
    <symbol id="m2" viewBox="0 0 120 120">
      <rect width="120" height="120" rx="30" fill="#6E4BD8"/>
      <circle cx="45" cy="52" r="10" fill="#fff"/><circle cx="75" cy="52" r="10" fill="#fff"/><circle cx="60" cy="34" r="10" fill="#fff"/>
      <path d="M24 64h72c0 18-16 32-36 32S24 82 24 64z" fill="#fff"/>
    </symbol>
    <!-- 8 Tray stack -->
    <symbol id="m3" viewBox="0 0 120 120">
      <rect width="120" height="120" rx="30" fill="#6E4BD8"/>
      <rect x="40" y="22" width="40" height="12" rx="6" fill="#fff" opacity=".55"/>
      <rect x="34" y="40" width="52" height="12" rx="6" fill="#fff" opacity=".8"/>
      <rect x="28" y="58" width="64" height="12" rx="6" fill="#fff"/>
      <path d="M22 72v10a12 12 0 0 0 12 12h52a12 12 0 0 0 12-12V72" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round"/>
    </symbol>
    <!-- 9 Net catch -->
    <symbol id="m4" viewBox="0 0 120 120">
      <rect width="120" height="120" rx="30" fill="#6E4BD8"/>
      <path d="M22 44c10 30 66 30 76 0" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round"/>
      <path d="M34 54l14 30M60 66v28M86 54L72 84M40 70c12 8 28 8 40 0" stroke="#fff" stroke-width="3.5" stroke-linecap="round" opacity=".8" fill="none"/>
      <circle cx="44" cy="30" r="8" fill="#fff"/><circle cx="66" cy="22" r="8" fill="#fff"/><circle cx="62" cy="48" r="8" fill="#fff"/>
    </symbol>
    <!-- 10 Converge -->
    <symbol id="m5" viewBox="0 0 120 120">
      <rect width="120" height="120" rx="30" fill="#6E4BD8"/>
      <path d="M24 30c22 0 26 30 36 30M24 60h36M24 90c22 0 26-30 36-30" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round"/>
      <rect x="62" y="44" width="34" height="32" rx="10" fill="#fff"/>
    </symbol>
    <!-- 11 Jar -->
    <symbol id="m6" viewBox="0 0 120 120">
      <rect width="120" height="120" rx="30" fill="#6E4BD8"/>
      <rect x="42" y="20" width="36" height="10" rx="4" fill="#fff"/>
      <path d="M44 34h32v4c10 4 14 12 14 22v22a12 12 0 0 1-12 12H42a12 12 0 0 1-12-12V60c0-10 4-18 14-22z" fill="#fff"/>
      <circle cx="50" cy="76" r="7" fill="#6E4BD8"/><circle cx="70" cy="76" r="7" fill="#6E4BD8"/><circle cx="60" cy="61" r="7" fill="#6E4BD8"/>
    </symbol>
    <!-- 12 Pocket -->
    <symbol id="m7" viewBox="0 0 120 120">
      <rect width="120" height="120" rx="30" fill="#6E4BD8"/>
      <rect x="34" y="22" width="16" height="34" rx="5" fill="#fff" opacity=".6" transform="rotate(-12 42 39)"/>
      <rect x="52" y="18" width="16" height="38" rx="5" fill="#fff" opacity=".85"/>
      <rect x="70" y="22" width="16" height="34" rx="5" fill="#fff" opacity=".6" transform="rotate(12 78 39)"/>
      <path d="M26 46h68v24c0 14-16 26-34 26S26 84 26 70z" fill="#fff"/>
      <path d="M44 62c10 6 22 6 32 0" fill="none" stroke="#6E4BD8" stroke-width="5" stroke-linecap="round"/>
    </symbol>
    <!-- 13 Orbit hub -->
    <symbol id="m8" viewBox="0 0 120 120">
      <rect width="120" height="120" rx="30" fill="#6E4BD8"/>
      <circle cx="60" cy="60" r="30" fill="none" stroke="#fff" stroke-width="5" stroke-dasharray="10 9" opacity=".7"/>
      <circle cx="60" cy="60" r="15" fill="#fff"/>
      <circle cx="60" cy="30" r="7" fill="#fff"/><circle cx="86" cy="75" r="7" fill="#fff"/><circle cx="34" cy="75" r="7" fill="#fff"/>
    </symbol>
    <!-- 14 Open box -->
    <symbol id="m9" viewBox="0 0 120 120">
      <rect width="120" height="120" rx="30" fill="#6E4BD8"/>
      <path d="M46 46l-6-20M60 46V20M74 46l6-20" stroke="#fff" stroke-width="7" stroke-linecap="round"/>
      <path d="M24 50h72l-6 36a10 10 0 0 1-10 8H40a10 10 0 0 1-10-8z" fill="#fff"/>
      <path d="M46 66h28" stroke="#6E4BD8" stroke-width="6" stroke-linecap="round"/>
    </symbol>
    <!-- 15 Channel catch -->
    <symbol id="m10" viewBox="0 0 120 120">
      <rect width="120" height="120" rx="30" fill="#6E4BD8"/>
      <rect x="22" y="20" width="22" height="16" rx="3" fill="none" stroke="#fff" stroke-width="4"/><path d="M22 22l11 8 11-8" fill="none" stroke="#fff" stroke-width="4" stroke-linejoin="round"/>
      <path d="M52 18h18v12H59l-7 6z" fill="#fff"/>
      <rect x="78" y="20" width="18" height="14" rx="3" fill="#fff"/><path d="M96 24l6-3v12l-6-3z" fill="#fff"/>
      <path d="M26 56h68c0 22-16 38-34 38S26 78 26 56z" fill="#fff"/>
      <path d="M48 70l8 8 16-16" fill="none" stroke="#6E4BD8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
  </defs>
</svg>

<div class="grid" id="grid"></div>

<script>
  const OPTS = [
    ['m1', 'Funnel', 'Three items funnel into one narrow spout. Very clear “many in, one out”, though funnels can feel like a sales pipeline.'],
    ['m2', 'Bowl of three', 'An evolution of the current mark: three items held in one bowl. Friendly and recognisable at small sizes.'],
    ['m3', 'Tray stack', 'Items land in a stack inside one tray, like an inbox that keeps everything organised.'],
    ['m4', 'Net catch', 'Three items caught mid-air in a net. The most direct take on “nothing slips through”.'],
    ['m5', 'Converge', 'Three lines from different places merge into one block. Abstract, modern, and good for motion.'],
    ['m6', 'Keeper jar', 'A jar with lid, holding three items. Warm and a little playful; “keep” in the most literal sense.'],
    ['m7', 'Pocket', 'Notes tucked safely into a pocket. Personal and portable, fits a solo operator on the go.'],
    ['m8', 'Orbit hub', 'Three items circling into one centre. Feels like a system and animates well, but less literal.'],
    ['m9', 'Open box', 'Things dropping into one box. Simple, sturdy and very legible small.'],
    ['m10', 'Channel catch', 'An email, a chat bubble and a video call fall into one bowl that checks them off. Tells the whole story, but busy at 16px.']
  ];
  const use = (id, cls) => `<svg class="${cls || ''}" viewBox="0 0 120 120" role="img" aria-label="Logo option"><use href="#${id}"/></svg>`;
  document.getElementById('grid').innerHTML = OPTS.map(([id, name, why], i) => `
    <section class="opt">
      <h2><span class="num">${i + 6}</span>${name}</h2>
      <div class="row">${use(id, 'tile')}<div class="small">${use(id)}${use(id, 'tiny')}</div></div>
      <div class="lockup">${use(id)}<span>keeper</span></div>
      <p>${why}</p>
    </section>`).join('');
</script>
</body>
</html>
