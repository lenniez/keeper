<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keeper tray logo variations</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;600;700&display=swap">
<style>
  :root{--ink:#1E1B26;--ink-2:#5F596D;--line:#ECE9F1;--cream:#FCF8F3}
  *{box-sizing:border-box}
  body{margin:0;padding:32px 16px;background:var(--cream);font-family:"Instrument Sans",system-ui,sans-serif;color:var(--ink)}
  h1{margin:0 0 4px;font-size:28px;letter-spacing:-.02em}
  p.sub{margin:0 0 24px;color:var(--ink-2);font-size:16px;max-width:780px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;max-width:1320px}
  .opt{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:14px}
  .opt h2{margin:0;font-size:17px;display:flex;align-items:center;gap:8px}
  .num{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:7px;background:var(--ink);color:#fff;font-size:13px}
  .tag{font-size:12px;font-weight:700;color:#0F5E54;background:#E2F4F1;border-radius:999px;padding:2px 8px}
  .opt p{margin:0;color:var(--ink-2);font-size:15px;line-height:1.4}
  .row{display:flex;align-items:center;gap:16px}
  .tile{width:88px;height:88px}
  .small{display:flex;gap:10px;align-items:center}.small svg{width:32px;height:32px}.small .tiny{width:18px;height:18px}
  .lockup{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:12px;background:var(--cream)}
  .lockup svg{width:30px;height:30px}
  .lockup span{font-weight:700;font-size:26px;letter-spacing:-.035em;line-height:1}
  .lockup.dark{background:#1E1B26;color:#fff}
</style>
</head>
<body>
<h1>Tray logo, lighter variations</h1>
<p class="sub">Five lighter takes on the tray mark: tasks dropping in and kept in one place. Pale tiles with teal, marigold and peach gradients. Shown as an app icon, at favicon size, and with the wordmark on light and dark.</p>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="tealSea" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0F665A"/><stop offset="1" stop-color="#2AA083"/></linearGradient>
    <linearGradient id="seaMari" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#127567"/><stop offset=".6" stop-color="#3FA98A"/><stop offset="1" stop-color="#E9C25A"/></linearGradient>
    <linearGradient id="mariPeach" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F2C063"/><stop offset="1" stop-color="#E98A55"/></linearGradient>
    <linearGradient id="sunrise" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#127567"/><stop offset=".55" stop-color="#2AA083"/><stop offset="1" stop-color="#F2C063"/></linearGradient>
    <radialGradient id="glow" cx=".72" cy=".25" r=".7"><stop offset="0" stop-color="#F2C063" stop-opacity=".95"/><stop offset="1" stop-color="#F2C063" stop-opacity="0"/></radialGradient>

    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F3FBF8"/><stop offset="1" stop-color="#CDEDE3"/></linearGradient>
    <linearGradient id="cream2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFBF4"/><stop offset="1" stop-color="#F6E7D3"/></linearGradient>
    <linearGradient id="dawn" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFF4DF"/><stop offset=".55" stop-color="#FBE3D2"/><stop offset="1" stop-color="#D9F0E8"/></linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E9F7F2"/><stop offset="1" stop-color="#BFE6D9"/></linearGradient>
    <linearGradient id="trayG" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1C8F6B"/><stop offset="1" stop-color="#3FB394"/></linearGradient>
    <linearGradient id="trayGold" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2AA083"/><stop offset="1" stop-color="#E9B44C"/></linearGradient>
    <linearGradient id="card1" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F6C46A"/><stop offset="1" stop-color="#F2A86A"/></linearGradient>
    <linearGradient id="card2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8FD6C2"/><stop offset="1" stop-color="#5DBFA4"/></linearGradient>

    <!-- 1 mint tile, pastel cards, teal tray -->
    <symbol id="t1" viewBox="0 0 120 120">
      <rect width="120" height="120" rx="30" fill="url(#mint)"/>
      <rect x="40" y="22" width="40" height="14" rx="7" fill="url(#card1)" transform="rotate(-8 60 29)"/>
      <rect x="34" y="40" width="52" height="14" rx="7" fill="url(#card2)" transform="rotate(5 60 47)"/>
      <rect x="30" y="58" width="60" height="14" rx="7" fill="#fff"/>
      <path d="M22 66v12a16 16 0 0 0 16 16h44a16 16 0 0 0 16-16V66" fill="none" stroke="url(#trayG)" stroke-width="9" stroke-linecap="round"/>
    </symbol>
    <!-- 2 cream tile, marigold/peach cards, teal-to-gold tray -->
    <symbol id="t2" viewBox="0 0 120 120">
      <rect width="120" height="120" rx="30" fill="url(#cream2)"/>
      <rect x="40" y="22" width="40" height="14" rx="7" fill="#F6C46A" transform="rotate(-8 60 29)"/>
      <rect x="34" y="40" width="52" height="14" rx="7" fill="#F4B48E" transform="rotate(5 60 47)"/>
      <rect x="30" y="58" width="60" height="14" rx="7" fill="#8FD6C2"/>
      <path d="M22 66v12a16 16 0 0 0 16 16h44a16 16 0 0 0 16-16V66" fill="none" stroke="url(#trayGold)" stroke-width="9" stroke-linecap="round"/>
    </symbol>
    <!-- 3 dawn gradient tile, white cards with colored ticks, filled tray -->
    <symbol id="t3" viewBox="0 0 120 120">
      <rect width="120" height="120" rx="30" fill="url(#dawn)"/>
      <g transform="rotate(-6 60 30)"><rect x="38" y="23" width="44" height="13" rx="6.5" fill="#fff"/><circle cx="45" cy="29.5" r="3" fill="#E9A93A"/></g>
      <g transform="rotate(4 60 47)"><rect x="34" y="40" width="52" height="13" rx="6.5" fill="#fff"/><circle cx="41" cy="46.5" r="3" fill="#E98A55"/></g>
      <path d="M22 62h76v14a18 18 0 0 1-18 18H40a18 18 0 0 1-18-18z" fill="url(#trayG)"/>
      <rect x="32" y="56" width="56" height="13" rx="6.5" fill="#fff"/><circle cx="39" cy="62.5" r="3" fill="#1C8F6B"/>
    </symbol>
    <!-- 4 soft sky tile, round "pebble" tasks in a shallow bowl-tray -->
    <symbol id="t4" viewBox="0 0 120 120">
      <rect width="120" height="120" rx="30" fill="url(#sky)"/>
      <circle cx="46" cy="40" r="11" fill="#F6C46A"/><circle cx="72" cy="34" r="9" fill="#F4B48E"/><circle cx="62" cy="58" r="12" fill="#fff"/>
      <path d="M20 64h80c0 17-14 30-31 30H51c-17 0-31-13-31-30z" fill="url(#trayG)"/>
      <path d="M30 70h60" stroke="#fff" stroke-opacity=".35" stroke-width="3" stroke-linecap="round"/>
    </symbol>
    <!-- 5 white tile, outline tray, a single card landing with motion lines -->
    <symbol id="t5" viewBox="0 0 120 120">
      <rect width="120" height="120" rx="30" fill="#fff"/><rect x=".75" y=".75" width="118.5" height="118.5" rx="29.5" fill="none" stroke="#E6E1D9" stroke-width="1.5"/>
      <path d="M46 20v10M60 16v14M74 20v10" stroke="#F2C97C" stroke-width="4" stroke-linecap="round"/>
      <rect x="34" y="38" width="52" height="16" rx="8" fill="url(#card1)"/>
      <rect x="30" y="58" width="60" height="14" rx="7" fill="#CDEDE3"/>
      <path d="M22 64v14a16 16 0 0 0 16 16h44a16 16 0 0 0 16-16V64" fill="none" stroke="url(#trayG)" stroke-width="9" stroke-linecap="round"/>
    </symbol>
  </defs>
</svg>
<div class="grid" id="g"></div>
<script>
  const O=[
    ['t1','Mint tray','Mint tile, marigold and seafoam cards landing on a white one, teal tray. Fresh and light; the teal tray still anchors the brand.','Recommended'],
    ['t2','Cream tray','Warm cream tile with marigold, peach and mint cards and a teal-to-gold tray. The warmest and most “human”.'],
    ['t3','Dawn tray','Peach-to-mint gradient tile, white task cards with colored dots, and a solid teal tray. Reads like the app’s list itself.'],
    ['t4','Pebble bowl','Softer and more playful: round “pebble” tasks dropping into a shallow teal bowl on a pale sky tile.'],
    ['t5','Just landed','Clean white tile; one marigold card drops in with motion lines above a mint card in the tray. Simplest and most legible small.']
  ];
  const use=(id,c)=>`<svg class="${c||''}" viewBox="0 0 120 120"><use href="#${id}"/></svg>`;
  document.getElementById('g').innerHTML=O.map(([id,n,d,t],i)=>`<section class="opt">
    <h2><span class="num">${i+1}</span>${n}${t?` <span class="tag">${t}</span>`:''}</h2>
    <div class="row">${use(id,'tile')}<div class="small">${use(id)}${use(id,'tiny')}</div></div>
    <div class="lockup">${use(id)}<span>keeper</span></div>
    <div class="lockup dark">${use(id)}<span>keeper</span></div>
    <p>${d}</p></section>`).join('');
</script>
</body>
</html>
